<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f5132">
  <title>Scopa Online</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <section id="home" class="panel">
      <h1>🃏 Scopa Online</h1>
      <p class="subtitle">Gioca in 2 oppure 2 contro 2, da telefoni diversi</p>
      <label>Il tuo nome<input id="name" maxlength="20" placeholder="Marco"></label>

      <fieldset class="mode-picker">
        <legend>Modalità nuova partita</legend>
        <label class="mode-option">
          <input type="radio" name="mode" value="2" checked>
          <span><strong>1 contro 1</strong><small>2 giocatori · 2 telefoni</small></span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="4">
          <span><strong>2 contro 2</strong><small>4 giocatori · 4 telefoni</small></span>
        </label>
      </fieldset>

      <button id="createBtn" class="primary">Crea partita</button>
      <div class="divider">oppure</div>
      <label>Codice stanza<input id="room" maxlength="8" autocomplete="off" placeholder="A7K42"></label>
      <button id="joinBtn">Entra nella stanza</button>
      <p class="hint">Chi entra con il codice usa automaticamente la modalità scelta dal creatore.</p>
      <p id="homeMsg" class="msg"></p>
    </section>

    <section id="game" class="hidden">
      <header class="topbar">
        <div><strong id="gameTitle">SCOPA</strong><small id="roomLabel"></small></div>
        <button id="leaveBtn" class="small">Esci</button>
      </header>

      <div class="scoreboard">
        <div><span id="scoreLabelA">Giocatore A</span><strong id="scoreA">0</strong><small id="teamA"></small></div>
        <div><span id="scoreLabelB">Giocatore B</span><strong id="scoreB">0</strong><small id="teamB"></small></div>
      </div>

      <div id="players" class="players"></div>
      <p id="status" class="status">Connessione…</p>

      <section class="table-wrap">
        <div class="table-head"><span>Tavolo</span><span id="deckCount">Mazzo: 0</span></div>
        <div id="table" class="cards table-cards"></div>
      </section>

      <section id="captureBox" class="capture hidden">
        <strong>Scegli la presa</strong>
        <div id="captureChoices"></div>
      </section>

      <section class="hand-wrap">
        <h2>Le tue carte</h2>
        <div id="hand" class="cards hand"></div>
      </section>

      <div class="stats"><span id="scopeStats">Scope 0–0</span><span id="takenStats">Carte prese 0–0</span></div>
      <div class="actions"><button id="startBtn" class="primary hidden">Inizia partita</button><button id="newRoundBtn" class="hidden">Nuova mano</button><button id="resetBtn" class="danger hidden">Azzera partita</button></div>
      <p id="error" class="error"></p>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
