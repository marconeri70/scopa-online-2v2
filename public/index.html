<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073b2a">
  <title>Scopa Online</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <section id="home" class="panel home-panel">
      <h1>🃏 Scopa Online</h1>
      <p class="subtitle">1 contro 1 oppure 2 contro 2</p>
      <label>Il tuo nome<input id="name" maxlength="20" placeholder="Marco"></label>

      <fieldset class="mode-picker">
        <legend>Modalità nuova partita</legend>
        <label class="mode-option">
          <input type="radio" name="mode" value="2" checked>
          <span><strong>1 contro 1</strong><small>2 giocatori · 2 telefoni</small></span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="4">
          <span><strong>2 contro 2</strong><small>4 giocatori · 4 telefoni</small></span>
        </label>
      </fieldset>

      <button id="createBtn" class="primary">Crea partita</button>
      <div class="divider">oppure</div>
      <label>Codice stanza<input id="room" maxlength="8" autocomplete="off" placeholder="A7K42"></label>
      <button id="joinBtn">Entra nella stanza</button>
      <p class="hint">Chi entra usa automaticamente la modalità scelta dal creatore.</p>
      <p id="homeMsg" class="msg"></p>
    </section>

    <section id="game" class="game hidden">
      <header class="game-bar">
        <div class="brand">
          <strong id="gameTitle">SCOPA</strong>
          <small id="roomLabel"></small>
        </div>
        <div id="turnBadge" class="turn-badge">In attesa</div>
        <button id="leaveBtn" class="small leave">Esci</button>
      </header>

      <section class="game-table" aria-label="Tavolo da Scopa">
        <div id="opponents" class="opponents"></div>

        <div class="center-score" aria-live="polite">
          <span id="scoreNameA">Giocatore 1</span>
          <strong><span id="scoreA">0</span><i>–</i><span id="scoreB">0</span></strong>
          <span id="scoreNameB">Giocatore 2</span>
          <small>Totale partita · si vince a <b id="winningScore">11</b></small>
        </div>

        <div class="table-info">
          <span id="roundInfo">In attesa</span>
          <span id="deckCount">Mazzo: 0</span>
        </div>

        <div id="table" class="cards table-cards"></div>

        <div id="scopeZones" class="scope-zones"></div>

        <section id="captureBox" class="capture hidden">
          <strong>Scegli la presa</strong>
          <div id="captureChoices"></div>
        </section>

        <div class="self-area">
          <div class="self-meta">
            <div>
              <span class="you-label">TU</span>
              <strong id="selfName">—</strong>
            </div>
            <div class="mini-stats">
              <span id="scopeStats">Scope 0–0</span>
              <span id="takenStats">Carte prese 0–0</span>
            </div>
          </div>
          <div id="hand" class="cards hand"></div>
        </div>
      </section>

      <div class="bottom-actions">
        <button id="startBtn" class="primary hidden">Inizia partita</button>
        <button id="newRoundBtn" class="hidden">Nuova mano</button>
        <button id="resetBtn" class="danger hidden">Azzera partita</button>
        <p id="error" class="error"></p>
      </div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
